name: Nightly Test & Quality Assurance Run

on:
  schedule:
    - cron: '0 4 * * *' # Runs nightly at 4:00 AM UTC
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  node-validation:
    name: Node.js Verification & Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Production Bundle & Server Build
        run: npm run build

  python-validation:
    name: Python Security & Audit Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r core/ app.py -ll -s B101,B104

      - name: Dependency Vulnerability CVE Scanner (pip-audit)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --cov=core
